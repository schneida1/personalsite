<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Stream of Time: 6,030 years of universal history, after Sebastian Adams's scroll of 1871. A side project by Daniel Schneiderman.">
<link rel="canonical" href="https://danielschneiderman.com/stream-of-time/app/">

<title>The Stream of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a night-sky atlas above, the river of realms below, one gold reading line tying the two together. */
:root{
  --bg:#0b0f1c;--bg2:#121830;--bg3:#1b2342;--fg:#ece6d6;--fg2:#a6aec4;--fg3:#6f7894;
  --line:rgba(170,185,230,.08);--line2:rgba(170,185,230,.2);
  --gold:#e2bb6a;--gold2:#f6e0a8;--sky:#8fc6ff;--glass:rgba(13,18,36,.82);--shadow:rgba(0,0,0,.55);
  --dot:rgba(150,168,215,.17);--sS:60%;--sL:50%;--sL2:44%;--sA:.55;--sSt:76%;--halo:.13;--mS:78;--mL:64;--blend:screen;
  --display:"Cinzel","Trajan Pro",Georgia,serif;--body:"EB Garamond",Garamond,Georgia,serif;--ui:"Jost","Avenir Next",system-ui,sans-serif;
  --lw:176px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eceef3;--bg2:#f8f9fb;--bg3:#e1e5ee;--fg:#161b2e;--fg2:#4d5570;--fg3:#7c849b;
    --line:rgba(30,40,80,.07);--line2:rgba(30,40,80,.17);
    --gold:#8f6212;--gold2:#6a470a;--sky:#2a5f9e;--glass:rgba(248,249,251,.9);--shadow:rgba(20,30,60,.16);
    --dot:rgba(40,55,100,.15);--sS:52%;--sL:66%;--sL2:60%;--sA:.75;--sSt:34%;--halo:.12;--mS:58;--mL:44;--blend:multiply;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eceef3;--bg2:#f8f9fb;--bg3:#e1e5ee;--fg:#161b2e;--fg2:#4d5570;--fg3:#7c849b;
  --line:rgba(30,40,80,.07);--line2:rgba(30,40,80,.17);
  --gold:#8f6212;--gold2:#6a470a;--sky:#2a5f9e;--glass:rgba(248,249,251,.9);--shadow:rgba(20,30,60,.16);
  --dot:rgba(40,55,100,.15);--sS:52%;--sL:66%;--sL2:60%;--sA:.75;--sSt:34%;--halo:.12;--mS:58;--mL:44;--blend:multiply;
  color-scheme:light;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
.mark{display:flex;align-items:baseline;gap:14px;min-width:0}
h1{margin:0;font:600 1.45rem/1 var(--display);letter-spacing:.08em;white-space:nowrap}
.sub{font:italic 1rem/1.2 var(--body);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto;max-width:100%}
.eras{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.eras::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line2);color:var(--fg);font:500 .72rem/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chip.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chip.primary:hover{background:var(--gold2);border-color:var(--gold2)}
.chip.round{width:30px;height:28px;padding:0;font-size:1rem;letter-spacing:0}
.chip:disabled{opacity:.35;cursor:default}
.find{position:relative;margin:0}
.find input{background:var(--bg2);border:1px solid var(--line2);color:var(--fg);font:italic 1rem var(--body);padding:4px 14px;border-radius:999px;width:15rem;max-width:60vw}
.find input::placeholder{color:var(--fg3)}
#status{position:absolute;right:0;top:calc(100% + 6px);font:.95rem var(--body);color:var(--bg);background:var(--fg);padding:3px 10px;border-radius:6px;white-space:nowrap;z-index:30}
#status:empty{display:none}

/* Stage: atlas + reading card */
.stage{position:relative;flex:0 0 clamp(210px,38vh,380px);display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px);border-bottom:1px solid var(--line2);
  background:radial-gradient(ellipse 70% 90% at 40% 45%,var(--bg2),var(--bg) 75%)}
.atlas{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;animation:fadein 1.4s ease-out both}
.lit{position:absolute;left:18px;bottom:12px;font:500 .68rem/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);pointer-events:none}
.lit b{color:var(--gold);font-weight:500}
.maptip{position:absolute;z-index:4;pointer-events:none;background:var(--glass);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font:.95rem/1.25 var(--body);box-shadow:0 8px 20px var(--shadow);white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.maptip small{display:block;font:500 .64rem/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
.now{display:flex;flex-direction:column;gap:8px;padding:16px 20px 14px;border-left:1px solid var(--line);min-width:0;overflow:hidden}
.eyebrow{margin:0;font:500 .66rem/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--fg3)}
.bigyear{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:.9}
#nyNum{font-size:clamp(2.4rem,1.6rem + 2.4vw,3.6rem);font-weight:400;color:var(--gold2);letter-spacing:.02em}
#nySuf{font-size:1rem;color:var(--gold);letter-spacing:.1em}
.agebtn{align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font:italic 1.12rem/1.2 var(--body);color:var(--fg);text-align:left}
.agebtn:hover{color:var(--gold)}
.nev{background:none;border:0;border-left:2px solid var(--gold);padding:2px 0 2px 10px;cursor:pointer;text-align:left;font:.98rem/1.3 var(--body);color:var(--fg2)}
.nev b{display:block;font-weight:500;color:var(--fg)}
.nev:hover b{color:var(--gold)}
.nev[hidden]{display:none}
.marvel{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--gold);min-width:0}
.marvel svg{flex:none;width:84px;height:56px;padding:3px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:6px;background:var(--bg)}
.marvel span{font:italic .98rem/1.25 var(--body);color:var(--fg2);min-width:0}
.marvel:hover span{color:var(--fg)}
.alive{margin:0;font:.92rem/1.4 var(--body);color:var(--fg3)}
.alive button{background:none;border:0;padding:0;cursor:pointer;color:var(--fg2);font:inherit}
.alive button:hover{color:var(--gold);text-decoration:underline}

/* Tour card */
.tour{position:absolute;left:18px;top:14px;z-index:6;width:min(430px,calc(100% - 36px));max-height:calc(100% - 28px);overflow:auto;background:var(--glass);border:1px solid var(--line2);border-radius:14px;padding:14px 16px 12px;box-shadow:0 18px 40px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tour-n{display:flex;justify-content:space-between;margin:0;font:500 .66rem/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tour-n span:last-child{color:var(--fg2)}
.tour h2{margin:.45rem 0 .3rem;font:600 1.3rem/1.15 var(--display);letter-spacing:.04em;text-wrap:balance}
.tour p.td{margin:0;font-size:1.02rem;line-height:1.5;color:var(--fg)}
.tv{float:right;width:110px;margin:2px 0 6px 12px;color:var(--gold)}
.tv svg{display:block;width:100%;height:auto}
.tour-bar{display:flex;gap:3px;margin-top:.7rem;clear:both}
.tour-bar i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.tour-bar i.on{background:var(--gold)}
.tour-ctl{display:flex;flex-wrap:wrap;gap:5px;margin-top:.7rem}

.tour-bar button{flex:1;height:3px;padding:0;border:0;border-radius:2px;background:var(--line2);cursor:pointer;position:relative}
.tour-bar button::before{content:"";position:absolute;inset:-7px 0}
.tour-bar button.on{background:var(--gold)}
.tour-bar button.cur{box-shadow:0 0 8px var(--gold)}
.tour-num{display:none}
.scene.enter>*{animation:sceneIn .9s cubic-bezier(.2,.7,.2,1) both}
.scene.enter>h2{animation-delay:.12s}
.scene.enter>.td{animation-delay:.24s}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px)}}

/* Cinematic chapters: the stage takes the screen and the chapter becomes a scene */
.stage{transition:flex-basis .8s cubic-bezier(.3,.7,.2,1)}
body.cine .stage{flex-basis:clamp(320px,64vh,700px)}
body.threading .stage{flex-basis:clamp(260px,50vh,520px)}
@media (min-width:761px){
  body.cine .tour{top:0;left:0;bottom:0;width:min(470px,44%);max-height:none;border:0;border-right:1px solid var(--line2);border-radius:0;padding:26px 30px 20px;display:flex;flex-direction:column;
    background:linear-gradient(90deg,var(--bg) 0%,var(--glass) 100%);box-shadow:none}
  body.cine .scene{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center}
  body.cine .tour-num{display:block;font:400 clamp(3.5rem,2rem + 4vw,6rem)/.9 var(--display);color:color-mix(in srgb,var(--gold) 30%,transparent);letter-spacing:.04em}
  body.cine .tv{float:none;order:-1;width:min(220px,60%);margin:0 0 14px}
  body.cine .tour h2{font-size:clamp(1.5rem,1rem + 1.4vw,2.3rem);margin:.5rem 0 .6rem}
  body.cine .tour p.td{font-size:1.16rem;line-height:1.6;max-width:44ch}
  body.cine #nyNum{font-size:clamp(3rem,2rem + 3vw,5rem)}
}

/* Threads */
.thread{position:absolute;left:18px;top:14px;z-index:6;width:min(400px,calc(100% - 36px));max-height:calc(100% - 28px);overflow:auto;background:var(--glass);border:1px solid hsl(var(--th) 60% 55% / .5);border-radius:14px;padding:14px 16px 12px;box-shadow:0 18px 40px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.thread .tour-n span:first-child{color:hsl(var(--th) var(--mS) var(--mL))}
.thread h2{margin:.45rem 0 .3rem;font:600 1.25rem/1.15 var(--display);letter-spacing:.04em;text-wrap:balance}
.thread p.td{margin:0;font-size:1.02rem;line-height:1.5}
.th-bar{display:flex;gap:4px;margin-top:.8rem}
.th-bar button{flex:1;height:8px;padding:0;border:1px solid hsl(var(--th) 60% 55% / .5);border-radius:4px;background:transparent;cursor:pointer}
.th-bar button.on{background:hsl(var(--th) var(--mS) var(--mL))}
.th-bar button:hover{border-color:var(--fg)}
.thr{position:absolute;top:0;z-index:4;pointer-events:none;overflow:visible}
.th-glow{fill:none;stroke:hsl(var(--th) 80% 60% / .22);stroke-width:9;stroke-linecap:round}
.th-line{fill:none;stroke:hsl(var(--th) var(--mS) var(--mL));stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 4}
.th-node{pointer-events:auto;cursor:pointer}
.th-node circle{fill:var(--bg);stroke:hsl(var(--th) var(--mS) var(--mL));stroke-width:2}
.th-node text{font:600 10px var(--ui);fill:var(--fg);text-anchor:middle}
.th-node:hover circle{fill:hsl(var(--th) var(--mS) var(--mL))}
.th-node:hover text{fill:var(--bg)}
.picker{position:fixed;z-index:35;top:calc(env(safe-area-inset-top,0px) + 70px);right:18px;width:min(720px,calc(100% - 36px));max-height:calc(100% - 100px);overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px 20px;box-shadow:0 24px 60px var(--shadow)}
.pk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pk-head h2{margin:0;font:600 1.3rem/1.2 var(--display);letter-spacing:.06em}
.pk-head p{margin:.3rem 0 0;color:var(--fg2);font-style:italic}
.pk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.pk{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;min-width:0}
.pk:hover{border-color:hsl(var(--th) var(--mS) var(--mL));background:hsl(var(--th) 60% 50% / .08)}
.pk-sw{width:28px;height:4px;border-radius:2px;background:hsl(var(--th) var(--mS) var(--mL));box-shadow:0 0 10px hsl(var(--th) 80% 60% / .5)}
.pk b{font:600 .9rem/1.25 var(--display);letter-spacing:.05em}
.pk span:not(.pk-sw){font-size:.98rem;line-height:1.35;color:var(--fg2)}
.pk small{font:500 .62rem/1.3 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--fg3)}
.pk-ask{margin-top:14px}
.pk-msg{margin:.5rem 0 0;color:var(--fg2);font-style:italic}
.pk-msg:empty{display:none}

/* River */
.river{position:relative;flex:1;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;cursor:grab;overscroll-behavior:contain;scrollbar-color:var(--line2) transparent}
.scroller.grabbing{cursor:grabbing;user-select:none}
.chart{position:relative;min-height:100%}
.reader{position:absolute;top:0;bottom:0;width:0;z-index:9;pointer-events:none}
.reader::before{content:"";position:absolute;left:-.5px;top:30px;bottom:0;width:1px;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 50%,transparent) 40%,color-mix(in srgb,var(--gold) 15%,transparent))}
.reader::after{content:"";position:absolute;left:-22px;top:30px;bottom:0;width:44px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 7%,transparent),transparent)}
.reader b{position:absolute;top:7px;left:0;transform:translateX(-50%);background:var(--gold);color:var(--bg);font:600 .78rem/1 var(--display);letter-spacing:.06em;padding:5px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 0 18px color-mix(in srgb,var(--gold) 45%,transparent)}

.ruler{position:sticky;top:0;z-index:7;display:flex;height:40px;background:var(--bg);border-bottom:1px solid var(--line2)}
.lab{position:sticky;left:0;z-index:5;flex:none;width:var(--lw);height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 12px 0 16px;background:var(--bg);border-right:1px solid var(--line2);min-width:0;cursor:pointer}
.lab b{font:500 .7rem/1.1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .nw{display:flex;align-items:center;gap:6px;font:italic .9rem/1.1 var(--body);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.lab .nw::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:hsl(var(--h) var(--sS) var(--sL));box-shadow:0 0 8px hsl(var(--h) 80% 60% / .6)}
.lab .nw:empty::before{display:none}
.lab small{font:italic .78rem/1.15 var(--body);color:var(--fg3)}
.ruler .lab{cursor:default;font:500 .62rem/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.ticks{position:relative;flex:none;height:100%}
.tick{position:absolute;bottom:11px;transform:translateX(-50%);font:.68rem/1 var(--ui);color:var(--fg3);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.big{font:600 .78rem/1 var(--display);color:var(--fg2);letter-spacing:.04em}
.tick::after{content:"";position:absolute;left:50%;top:calc(100% + 4px);width:1px;height:5px;background:var(--fg3)}
.badge{position:absolute;top:8px;left:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:500 .7rem/18px var(--ui);padding:0 8px;border-radius:999px;pointer-events:none;opacity:0;white-space:nowrap;z-index:2}

.grid{position:absolute;top:40px;bottom:0;z-index:0;pointer-events:none}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gl.c{background:var(--line2);opacity:.6}
.cursor,.sliceline{position:absolute;top:0;bottom:0;left:0;width:1px;background:var(--fg);opacity:0}
.sliceline{width:2px;margin-left:-1px;background:var(--sky)}

.grp{position:relative;display:flex;height:30px}
.grp .lab{cursor:default;justify-content:flex-end;padding-bottom:5px;border-right-color:transparent;font:600 .74rem/1 var(--display);letter-spacing:.14em;color:var(--gold)}
.grp::after{content:"";position:absolute;left:var(--lw);right:0;bottom:0;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 35%,transparent),transparent 60%)}

.row{position:relative;display:flex;height:60px;border-bottom:1px solid var(--line)}
.track{position:absolute;top:0;bottom:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadein{from{opacity:0}}
.flow{position:absolute;left:0;top:0;overflow:visible}
.flow .halo{fill:hsl(var(--h) 80% 60% / var(--halo));pointer-events:none}
.flow .seg{fill:hsl(var(--h) var(--sS) var(--sL) / var(--sA));stroke:hsl(var(--h) 70% var(--sSt) / .5);stroke-width:.8;cursor:pointer;transition:fill .3s}
.flow .seg.alt{fill:hsl(var(--h) var(--sS) var(--sL2) / var(--sA))}
.flow .seg.live{fill:hsl(var(--h) calc(var(--sS) + 12%) calc(var(--sL) + 6%) / .95);stroke:hsl(var(--h) 85% var(--sSt) / .95);stroke-width:1.2}
.flow .seg:hover{fill:hsl(var(--h) calc(var(--sS) + 12%) calc(var(--sL) + 8%) / 1)}
.flow .seg.on{stroke:var(--fg);stroke-width:2}
.flow .dv{stroke:var(--bg);stroke-opacity:.8;stroke-width:1.2}
.sl{position:absolute;pointer-events:none;white-space:nowrap;overflow:hidden;color:var(--fg);z-index:1;text-shadow:0 0 6px var(--bg)}
.sl b{display:block;font:600 .72rem/14px var(--display);letter-spacing:.05em;overflow:hidden;text-overflow:clip}
.sl i{display:block;font:italic .74rem/13px var(--body);color:var(--fg2);overflow:hidden;text-overflow:ellipsis}
.row.sacred .flow .seg{fill:color-mix(in srgb,var(--gold) 16%,transparent);stroke:var(--gold);stroke-width:1;stroke-dasharray:4 3}
.row.sacred .flow .seg.live{fill:color-mix(in srgb,var(--gold) 30%,transparent)}
.row.sacred .flow .halo{fill:none}
.row.sacred .lab .nw::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.row.sacred .sl b{font-style:normal;color:var(--gold2)}

.ages{height:50px}
.age{position:absolute;top:12px;height:28px;padding:6px 10px 0;border-left:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-top:1px solid color-mix(in srgb,var(--gold) 60%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent);font:600 .78rem/1.1 var(--display);letter-spacing:.08em;color:var(--fg2);white-space:nowrap;overflow:hidden;cursor:pointer}
.atx{display:inline-block}
.age:hover,.age.on,.age.live{color:var(--gold2);border-color:var(--gold)}

.ev{position:absolute;top:40px;left:0;margin-left:-8px;display:flex;align-items:center;gap:4px;height:19px;padding:0 4px 0 0;background:none;border:0;cursor:pointer;z-index:2}
.sci{height:44px}
.sci .ev{top:13px}
.ic{width:16px;height:16px;flex:none;color:var(--gold);filter:drop-shadow(0 0 2px var(--bg)) drop-shadow(0 0 1px var(--bg));transition:transform .15s}
.sci .ic{color:var(--sky)}
.evl{font:italic .8rem/1 var(--body);color:var(--fg);white-space:nowrap;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),0 0 9px var(--bg)}
.ev:hover .ic,.ev:focus-visible .ic,.ev.on .ic{transform:scale(1.35)}
.ev:hover .evl{color:var(--gold2)}
.ev.nolabel .evl{display:none}

.life{position:absolute;height:17px;padding:0;background:none;border:0;cursor:pointer;text-align:left;z-index:2}

function flowRow(s,si){

    const x0=X(a), x1=X(b), w=Math.max(2,x1-x0), h=hh(g);
    const prev=s.s[j-1], next=s.s[j+1];
    const cp=prev&&Math.abs(prev[1]-g[0])<=20, cn=next&&Math.abs(next[0]-g[1])<=20;
    const e0=g[0]<=B[0]?h:cp?(h+hh(prev))/2:h*.3;
    const e1=g[1]>=NOW?h:cn?(h+hh(next))/2:h*.3;
    const t=Math.min(38,w*.35);
    if(g.w>=.7) halo+=`<path class="halo" d="${ribbon(x0-2,x1+2,e0+4,e1+4,h+5,t)}"/>`;
    segs+=`<path class="seg${j%2?" alt":""}${sel.seg===si+"-"+j?" on":""}" data-seg="${si}-${j}" d="${ribbon(x0,x1,e0,e1,h,t)}"><title>${g[2]}, ${fr(g[0],g[1])}</title></path>`;
    if(cp) segs+=`<line class="dv" x1="${f1(x0)}" x2="${f1(x0)}" y1="${f1(CY-e0)}" y2="${f1(CY+e0)}"/>`;
    const avail=w-t*1.1-8;
    if(avail>34&&h>=8){

      labels+=`<div class="sl" data-a="${f1(x0+t*.55+4)}" data-b="${f1(x1-t*.55-4)}" style="left:${f1(x0+t*.55+4)}px;top:${showD?CY-13:CY-7}px;width:${f1(avail)}px"><b>${g[2]}</b>${showD?`<i>${g[3]}</i>`:""}</div>`;

}

    const x1=PX(pa[0]),y1=PY(pa[1]),x2=PX(pb[0]),y2=PY(pb[1]), mx=(x1+x2)/2, my=(y1+y2)/2-Math.max(14,Math.hypot(x2-x1,y2-y1)*.35);

    if(a.sac){ c.fillStyle=TK.gold; c.save(); c.translate(a.x+(a.st.k==="bible"?-7:0),a.y+(a.st.k==="bible"?-7:0)); c.rotate(Math.PI/4); c.fillRect(-2.6,-2.6,5.2,5.2); c.restore(); }

  ACT.filter(a=>!a.sac).sort((p,q)=>(q.foc-p.foc)||(q.w-p.w)).forEach(a=>{
    if(n>=maxL||(!a.foc&&curFocus)) return;

    const t=a.g[2], tw=c.measureText(t).width;
    const tries=[[8,-1],[-tw-8,-1],[8,-12],[-tw-8,12],[8,12],[-tw/2,-14],[-tw/2,15]];

      if(boxes.some(b=>bx<b[0]+b[2]+3&&bx+bw+3>b[0]&&by<b[1]+b[3]&&by+bh>b[1])) continue;

const samplePromise=(window.claude&&typeof window.claude.use==="function")?window.claude.use("sample").catch(()=>null):Promise.resolve(null);
const deepCache=new Map();
let deepCtl=null, curDeep=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(t){
  let h="",list=false,para=[];
  const flushP=()=>{ if(para.length){ h+=`<p>${para.join(" ")}</p>`; para=[]; } };
  const closeL=()=>{ if(list){ h+="</ul>"; list=false; } };
  for(const raw of esc(t).split(/\n/)){
    const l=raw.trim(); let m;
    if(!l){ flushP(); closeL(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ flushP(); closeL(); h+=`<h4>${m[1]}</h4>`; }
    else if((m=l.match(/^[-*•]\s+(.*)/))){ flushP(); if(!list){ h+="<ul>"; list=true; } h+=`<li>${m[1]}</li>`; }
    else { closeL(); para.push(l); }
  }
  flushP(); closeL();
  return h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,"$1<em>$2</em>");
}

const BASE=`You are a historian writing for an interactive world-history timeline modeled on Sebastian Adams's 1871 Synchronological Chart. The reader just clicked an item and wants much more context than the one-line caption on the chart. Write vivid, accurate, well-organized prose for a curious adult, about 450 to 600 words. Use exactly the section headings given, each on its own line beginning with "## ". Keep paragraphs short; bold key names with **double asterisks**. Use bulleted lines beginning with "- " only where a section asks for them. Be careful with facts: give approximate dates where uncertain, say when historians disagree, and do not invent quotations or precise statistics. No title or preamble before the first heading. Write years before 1000 with B.C. or A.D.`;
function sacredPrompt(what,caption,era,y,sections){

function deepSlot(key,wikiTerm){

    <div class="ai" id="aiOut"><p class="thinking">Thinking</p></div>

const isCur=(key,ctl)=>{ const d=document.getElementById("deep"); return d&&d.dataset.key===key&&(!ctl||deepCtl===ctl); };
function errCopy(code){
  if(code==="not_granted") return "The fuller story needs permission to ask Claude. You can allow it from this artifact's permissions menu.";

async function startDeep(d){

    out.innerHTML=md(cached.text); renderQA(cached); form.hidden=false; return;
  }
  const sample=await samplePromise;
  if(!isCur(d.key)) return;
  if(!sample){ document.getElementById("deep").remove(); return; }
  const ctl=new AbortController(); deepCtl=ctl;
  out.innerHTML=`<p class="thinking">Thinking</p>`; stop.hidden=false; form.hidden=true;

  }finally{

  }
}

async function askFollowUp(q){

  qa.append(blockQ,blockA); blockQ.scrollIntoView({block:"nearest",behavior:RM?"auto":"smooth"});

  entry.qa.forEach(x=>turns.push({role:"user",content:x.q},{role:"assistant",content:x.a}));
  turns.push({role:"user",content:q+"\n\nAnswer in about 100 to 250 words of plain prose in the same historian's voice, with no headings. Say so if historians are unsure, and don't invent quotations or statistics."});
  const ctl=new AbortController(); deepCtl=ctl; stop.hidden=false; form.querySelector("button").disabled=true;

    entry.qa.push({q,a:text}); blockA.innerHTML=md(text);

function drawThreadMap(c,Y,hsl){
  const boxes=[];
  if(!curThread) return boxes;
  const pts=curThread.s.map((st,i)=>{ const l=stepLoc(st); return l&&{i,y:st.y,t:st.t,x:PX(l[0]),py:PY(l[1])}; }).filter(Boolean);
  const h=curThread.h, ctrl=(a,b)=>({x:(a.x+b.x)/2,y:(a.py+b.py)/2-Math.max(10,Math.hypot(b.x-a.x,b.py-a.py)*.3)});
  const qp=(a,m,b,t)=>({x:(1-t)*(1-t)*a.x+2*(1-t)*t*m.x+t*t*b.x,y:(1-t)*(1-t)*a.py+2*(1-t)*t*m.y+t*t*b.py});
  c.lineCap="round";
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], m=ctrl(a,b);
    c.setLineDash([3,5]); c.strokeStyle=hsl(h,.3); c.lineWidth=1.2;
    c.beginPath(); c.moveTo(a.x,a.py); c.quadraticCurveTo(m.x,m.y,b.x,b.py); c.stroke(); c.setLineDash([]);
    const t=Y<=a.y?0:Y>=b.y?1:(Y-a.y)/Math.max(1,b.y-a.y);
    if(t>0){
      c.strokeStyle=hsl(h,.95,8); c.lineWidth=2.4; c.beginPath(); c.moveTo(a.x,a.py);
      for(let q=1;q<=24;q++){ const p=qp(a,m,b,t*q/24); c.lineTo(p.x,p.y); } c.stroke();
      if(t<1){ const p=qp(a,m,b,t); c.fillStyle=hsl(h,1,20); c.beginPath(); c.arc(p.x,p.y,3.4,0,6.2832); c.fill(); }
    }
  }
  let last=null;
  c.font=`600 10px Jost,system-ui,sans-serif`; c.textAlign="center"; c.textBaseline="middle";
  pts.forEach(p=>{
    const on=p.y<=Y; if(on) last=p;
    c.beginPath(); c.arc(p.x,p.py,7,0,6.2832);
    if(on){ c.fillStyle=hsl(h,1,6); c.fill(); c.fillStyle=TK.bg; c.fillText(p.i+1,p.x,p.py+.5); }
    else { c.fillStyle=TK.bg; c.fill(); c.strokeStyle=hsl(h,.5); c.lineWidth=1.2; c.stroke(); c.fillStyle=hsl(h,.7); c.fillText(p.i+1,p.x,p.py+.5); }
    boxes.push([p.x-8,p.py-8,16,16]);
  });
  if(last){
    c.font=`italic 500 ${MV.w<560?13:15}px "EB Garamond",Georgia,serif`; c.textAlign="left";
    const tw=c.measureText(last.t).width, bx=Math.min(MV.w-tw-8,last.x+12), by=last.py-16;
    c.lineWidth=4; c.strokeStyle=TK.bg; c.strokeText(last.t,bx,by); c.fillStyle=TK.fg; c.fillText(last.t,bx,by);
    boxes.push([bx,by-9,tw,18]);
  }
  c.textBaseline="middle";
  return boxes;
}

  const T=curThread; if(!T) return; const st=T.s[i];
  const ev=EVENTS.find(e=>e.t.toLowerCase()===st.t.toLowerCase());
  if(ev){ openEvent(ev); return; }
  sel={y:st.y,ev:null,p:null,seg:null}; markSel();
  const s=SM[st.k], j=activeIdx(s,st.y), key="th:"+T.id+":"+i;
  const near=[T.s[i-1],T.s[i+1]];
  let h=`${figFor(VIG.find(v=>v.k===st.k&&Math.abs(v.y-st.y)<=40))}<p class="p-year">${fmt(st.y)}</p><h2>${st.t}</h2><p class="p-stream">${s.n} · ${T.n}, step ${i+1} of ${T.s.length}</p><p class="body">${st.d}</p>`;
  h+=`<p class="body note">${near[0]?`Before this: ${near[0].t} (${fmt(near[0].y)}). `:""}${near[1]?`Next: ${near[1].t} (${fmt(near[1].y)}).`:""}</p>`;
  if(j>=0&&s.k!=="ages") h+=eraLink(s.idx,j,st.y);
  h+=deepSlot(key,st.t)+meanwhile(st.y,{title:"Meanwhile, around "+fmt(st.y)});
  openPanel(h);
  startDeep({key,prompt:`${BASE}

The item is one step in a thread that follows "${T.n}" through history (${T.b}). This step: "${st.t}", ${fmt(st.y)}, in the chart's "${s.n}" stream.
Caption on the chart: ${st.d}
The whole thread, in order: ${T.s.map(x=>x.t+" ("+fmt(x.y)+")").join("; ")}.
What the chart shows at this time: ${ctxAt(st.y)}

Sections:
## Background
## What happened
## The thread
(how this step grew out of the one before and led to the one after)
## Worth knowing
(three or four bullets of surprising but well-established details)`});
}

/* The thread picker, with an option to have Claude trace any theme */
const pickerEl=$("picker");
function renderPicker(){
  $("pkList").innerHTML=THREADS.map((T,i)=>`<button class="pk" data-t="${i}" style="--th:${T.h}"><span class="pk-sw"></span><b>${esc(T.n)}</b><span>${esc(T.b)}</span><small>${T.s.length} steps · ${fmt(T.s[0].y)} to ${fmt(T.s[T.s.length-1].y)}</small></button>`).join("");
}
function closePicker(){ pickerEl.hidden=true; }
$("threadBtn").addEventListener("click",()=>{
  if(curThread){ closeThread(); return; }
  if(!pickerEl.hidden){ closePicker(); return; }
  renderPicker(); pickerEl.hidden=false;
});
$("pkClose").addEventListener("click",closePicker);
$("pkList").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(b) startThread(THREADS[+b.dataset.t]); });
addEventListener("keydown",e=>{ if(e.key==="Escape"&&!pickerEl.hidden) closePicker(); });

let thCtl=null;
samplePromise.then(s=>{ if(s) $("askThread").hidden=false; });
$("askThread").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("threadQ").value.trim(); if(!q) return;
  const sample=await samplePromise; if(!sample) return;
  const msg=$("threadMsg"), btn=$("askThread").querySelector("button");
  if(thCtl) thCtl.abort();
  thCtl=new AbortController(); btn.disabled=true;
  msg.innerHTML=`<span class="thinking">Tracing “${esc(q)}” through history. This can take up to a minute</span>`;
  const keys=STREAMS.filter(s=>ANCH[s.k]&&!s.sacred);
  const prompt=`You are building a "thread" for an interactive world-history timeline: 8 to 12 real moments, in chronological order, that trace one theme across history and across the world.
Theme: "${q}"
Place each step in exactly one of these regions, using its key: ${keys.map(s=>`${s.k} = ${s.n}`).join("; ")}.
Spread the steps across several regions where the history allows. Years are integers from -4004 to 2026, negative for B.C. Use well-established events and approximate dates only; never invent events. If the theme is not a historical subject, pick the closest historical reading of it.
Reply with only JSON, no prose: {"name":"2 to 4 word title","blurb":"one sentence","steps":[{"y":1440,"k":"ger","t":"title of at most 6 words","d":"one sentence of at most 25 words"}]}`;
  try{
    const r=await sample.json(prompt,{modelTier:"default",signal:thCtl.signal});
    const ok=r&&Array.isArray(r.steps)?r.steps.filter(st=>st&&SM[st.k]&&ANCH[st.k]&&Number.isFinite(+st.y)&&+st.y>=B[0]&&+st.y<=NOW&&st.t).map(st=>({y:Math.round(+st.y),k:st.k,t:String(st.t).slice(0,60),d:String(st.d||"").slice(0,220)})):[];
    if(ok.length<3){ msg.textContent="Claude couldn't trace that one. Try a broader theme, such as horses, coffee or women rulers."; return; }
    ok.sort((a,b)=>a.y-b.y);
    const T={id:"c"+Date.now(),n:String(r.name||q).slice(0,40),h:[300,160,330,85,185][THREADS.length%5],b:String(r.blurb||"").slice(0,160)||"A thread traced by Claude.",s:ok,mine:true};
    THREADS.push(T); msg.textContent=""; $("threadQ").value="";
    startThread(T);
  }catch(err){
    msg.textContent=err&&err.code==="cancelled"?"":err&&err.code==="not_granted"?"Tracing a new thread needs permission to ask Claude. You can allow it from this artifact's permissions menu.":err&&err.code==="rate_limited"?"Too many requests at once. Wait a moment, then try again.":"That thread couldn't be traced just now. Try again, or pick one above.";
  }finally{ btn.disabled=false; thCtl=null; }
});

const legend=[["sword","Battles, wars and conquests"],["crown","Rulers and reigns"],["flag","Revolutions, reforms and new states"],["book","Writings, laws and books"],["star","Faiths and teachers"],["column","Buildings and foundings"],["ship","Voyages and flights"],["idea","Ideas and inventions"],["scroll","Stories from scripture"]];
$("about").addEventListener("click",()=>{
  openPanel(`<h2>About this chart</h2>
  <p class="body">In 1871 Sebastian C. Adams published the Synchronological Chart of Universal History, a hand-colored scroll about 23 feet long that promised to teach "through the eye to the mind." Each nation ran as a stream from left to right, swelling in its age of power and narrowing in decline, so a reader could look straight down any year and see what was happening everywhere at once.</p>
  <p class="body">This edition keeps that idea and adds a map. The gold reading line in the middle of the river marks one year. The atlas above lights each realm that was alive in that year, tinted in its stream’s color, with ripples for nearby events and dashed currents where one realm flowed into another. Travel the river and the world changes under you.</p>
  <p class="body">Choose a stream, a map light, a pictogram, a name or a marvel to open its story. Choose empty space for a cross-section of that year. Each opens a fuller account written by Claude, with room for follow-up questions.</p>
  <p class="body">Tell the story plays nineteen chapters as scenes: the map flies to the realms that matter and the river travels there year by year. Use the arrow keys or the chapter bar to move between them. Follow a thread traces one idea, such as writing, gunpowder or the Silk Road, as a numbered path through the river and a spreading route across the map; the path grows as you travel. Claude can also trace a thread for any theme you name.</p>
  <h3>Key to the pictograms</h3>
  <ul class="key">${legend.map(([c,t])=>`<li><svg class="ic" style="${c==="idea"?"color:var(--sky)":""}"><use href="#ic-${c}"/></svg>${t}</li>`).join("")}</ul>
  <h3>Scale and sources</h3>
  <p class="body">Like Adams, the chart begins at 4004 B.C., the creation date reckoned by Archbishop Ussher. The Bible band keeps those traditional dates; the Quran gives no dates, so its stories sit approximately beside their biblical counterparts. The historical bands follow modern scholarship. By default, years before 1000 B.C. are compressed and the last three centuries stretched. Press Even scale to draw every century the same width. Map positions mark each realm’s heartland in each era and are approximate. Early dates are approximate too, and the realms shown are a sample of world history rather than all of it.</p>
  <h3>Getting around</h3>
  <p class="body">Drag or scroll sideways to travel. Zoom with the plus and minus buttons, a pinch, or Ctrl and the scroll wheel. Search for a year such as 1492 or 500 B.C., an event, a dynasty or a person. Drag along the strip at the bottom to cross millennia at once.</p>`);
});

let stT=0;
function say(msg){ statusEl.textContent=msg; clearTimeout(stT); if(msg) stT=setTimeout(()=>statusEl.textContent="",5000); }
document.getElementById("find").addEventListener("submit",e=>{
  e.preventDefault();
  const raw=document.getElementById("q").value.trim(); if(!raw) return;
  const m=raw.match(/^(?:a\.?d\.?\s*)?(\d{1,4})\s*(b\.?c\.?(?:e\.?)?)?\s*(a\.?d\.?|c\.?e\.?)?$/i);
  if(m){
    let y=+m[1]; if(m[2]) y=-y;
    if(y<B[0]||y>NOW){ say("This chart runs from 4004 B.C. to "+NOW+"."); return; }
    say(""); jump(y,.4); openSlice(y); return;
  }
  const q=raw.toLowerCase();
  const p=FIG.find(f=>f.n.toLowerCase().includes(q));
  if(p){ say(""); jump(p.b,.3); openPerson(p); return; }
  const ev=EVENTS.find(x=>x.t.toLowerCase().includes(q));
  if(ev){ say(""); jump(ev.y,.4); openEvent(ev); return; }
  const findSeg=idx=>{ for(let si=0;si<STREAMS.length;si++){ const s=STREAMS[si]; for(let j=0;j<s.s.length;j++){ if(s.s[j][idx].toLowerCase().includes(q)) return [si,j]; } } return null; };
  const goSeg=([si,j])=>{ const g=STREAMS[si].s[j]; const a=Math.max(g[0],B[0]); say(""); jump(a,.25); openEra(si,j,snap((a+Math.min(g[1],NOW))/2)); };
  let hit=findSeg(2); if(hit){ goSeg(hit); return; }
  const ev2=EVENTS.find(x=>x.d.toLowerCase().includes(q));
  if(ev2){ say(""); jump(ev2.y,.4); openEvent(ev2); return; }
  hit=findSeg(3); if(hit){ goSeg(hit); return; }
  say(`Nothing matches “${raw}”. Try a year such as 1492 or 500 B.C.`);
});


const eras=$("eras");
ERAS.forEach(([n,y])=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=n; b.addEventListener("click",()=>jump(y===-4004?-3900:y)); eras.appendChild(b); });
$("zin").addEventListener("click",()=>zoom(k*1.5));
$("zout").addEventListener("click",()=>zoom(k/1.5));
const scaleBtn=$("scale");
scaleBtn.addEventListener("click",()=>{
  const even=scaleBtn.getAttribute("aria-pressed")!=="true";
  const y=centerYear();
  scaleBtn.setAttribute("aria-pressed",String(even));
  setScale(even); k=Math.max(k,kMin()); render(); buildStrip();
  sc.scrollLeft=X(y)+PAD-viewW()/2; update();
});

/* The whole river in miniature: event density above, the ages below */
function buildStrip(){
  $("strip").innerHTML=STREAMS[0].s.map((g,j)=>`<span style="width:${((uOf(g[1])-uOf(g[0]))/U*100).toFixed(3)}%;opacity:${j%2?.35:.85}" title="${g[2]}"></span>`).join("");
  $("slabs").innerHTML=STREAMS[0].s.map(g=>{ const a=uOf(g[0])/U*100, w=(uOf(g[1])-uOf(g[0]))/U*100; return w>9?`<span style="left:${a.toFixed(2)}%">${g[2]}</span>`:""; }).join("");
  const N=140, bins=new Array(N).fill(0);
  EVENTS.forEach(e=>{ bins[Math.min(N-1,Math.floor(uOf(e.y)/U*N))]++; });
  const mx=Math.max(...bins);
  const hist=$("hist"); hist.setAttribute("viewBox",`0 0 ${N} 18`);
  hist.innerHTML=bins.map((c,i)=>c?`<rect x="${i+.15}" y="${(18-18*Math.sqrt(c/mx)).toFixed(2)}" width=".7" height="${(18*Math.sqrt(c/mx)).toFixed(2)}"/>`:"").join("");
}
buildStrip();
let miniDrag=false;
function miniTo(cx){ const r=mini.getBoundingClientRect(); const f=Math.max(0,Math.min(1,(cx-r.left)/r.width)); sc.scrollLeft=f*W+PAD-viewW()/2; }
mini.addEventListener("pointerdown",e=>{ miniDrag=true; mini.setPointerCapture(e.pointerId); miniTo(e.clientX); });
mini.addEventListener("pointermove",e=>{ if(miniDrag) miniTo(e.clientX); });
mini.addEventListener("pointerup",()=>miniDrag=false);
mini.addEventListener("pointercancel",()=>miniDrag=false);
mini.addEventListener("keydown",e=>{
  const ft=W/23;
  if(e.key==="ArrowRight"){ sc.scrollLeft+=ft; e.preventDefault(); }
  if(e.key==="ArrowLeft"){ sc.scrollLeft-=ft; e.preventDefault(); }
});

let rT=0;
addEventListener("resize",()=>{
  clearTimeout(rT);
  rT=setTimeout(()=>{ const y=centerYear(); k=Math.max(k,kMin()); render(); sc.scrollLeft=X(y)+PAD-viewW()/2; update(); },150);
});

/* Tell the story */
const tourEl=$("tour"), storyBtn=$("storyBtn"), playBtn=$("tourPlay");
let tourI=0, tourTimer=0, tourPlaying=false;
$("tourBar").innerHTML=TOUR.map((s,i)=>`<button data-i="${i}" title="${roman(i+1)}. ${s.t}" aria-label="Chapter ${i+1}: ${s.t}"></button>`).join("");
$("tourBar").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ tourPlaying=false; showStop(+b.dataset.i); } });
function applyFocus(keys){
  curFocus=keys;
  chart.classList.toggle("focus",!!keys);
  chart.querySelectorAll(".row[data-k]").forEach(r=>r.classList.toggle("hl",!!keys&&keys.includes(r.dataset.k)));
  queueAtlas();
}
function schedule(){
  clearTimeout(tourTimer);
  playBtn.textContent=tourPlaying?"Pause":"Play";
  if(tourPlaying&&tourI<TOUR.length-1) tourTimer=setTimeout(()=>showStop(tourI+1),16000);
}
/* Each chapter is a scene: the stage opens up, the camera flies to the chapter's realms, and the river travels there year by year */
function showStop(i){
  const prev=tourI;
  tourI=Math.max(0,Math.min(TOUR.length-1,i));
  const s=TOUR[tourI], entering=tourEl.hidden;
  $("tourN").textContent=`Chapter ${roman(tourI+1)} of ${roman(TOUR.length)}`;
  $("tourY").textContent=fmt(s.y);
  $("tourNum").textContent=roman(tourI+1);
  $("tourT").textContent=s.t;
  { const v=VIG.find(x=>x.key===TOURV[tourI]); $("tourV").innerHTML=v?vsvg(v,RM?"":"draw"):""; }
  $("tourD").textContent=s.d;
  document.querySelectorAll("#tourBar button").forEach((b,j)=>{ b.classList.toggle("on",j<=tourI); b.classList.toggle("cur",j===tourI); });
  $("tourPrev").disabled=tourI===0;
  $("tourNext").disabled=tourI===TOUR.length-1;
  const sceneEl=$("tourScene"); sceneEl.classList.remove("enter"); void sceneEl.offsetWidth; sceneEl.classList.add("enter");
  if(entering){ closeThread(); closePicker(); document.body.classList.add("cine"); }
  tourEl.hidden=false; storyBtn.setAttribute("aria-pressed","true");
  sel={y:s.y,ev:null,p:null,seg:null}; markSel();
  applyFocus(s.k);
  const go=()=>{
    const first=chart.querySelector(".row.hl");
    const dur=entering?1600:Math.min(3200,1400+Math.abs(uOf(s.y)-uOf(TOUR[prev].y))*.25);
    travelTo(s.y,dur,first?Math.max(0,first.offsetTop-60):0);
    const pts=(s.k||[]).map(k=>stepLoc({k,y:s.y})).filter(Boolean);
    camTo(fitCam(pts),innerWidth>760?tourEl.offsetWidth:0,dur);
  };
  if(entering) requestAnimationFrame(()=>{ sizeMap(); go(); }); else go();
  schedule();
}
function closeTour(){
  if(tourEl.hidden) return;
  clearTimeout(tourTimer); tourPlaying=false; tourEl.hidden=true; storyBtn.setAttribute("aria-pressed","false");
  document.body.classList.remove("cine");
  applyFocus(null); sel.y=null; placeSlice();
  requestAnimationFrame(()=>{ sizeMap(); camTo(CAM0,0,1000); });
}
storyBtn.addEventListener("click",()=>{ if(!tourEl.hidden){ closeTour(); return; } tourPlaying=!RM; showStop(0); });
addEventListener("keydown",e=>{
  if(tourEl.hidden||panel.classList.contains("open")||e.target.closest("input")) return;
  if(e.key==="ArrowRight"&&!e.target.closest(".scroller")){ tourPlaying=false; showStop(tourI+1); e.preventDefault(); }
  if(e.key==="ArrowLeft"&&!e.target.closest(".scroller")){ tourPlaying=false; showStop(tourI-1); e.preventDefault(); }
});
$("tourPrev").addEventListener("click",()=>{ tourPlaying=false; schedule(); showStop(tourI-1); });
$("tourNext").addEventListener("click",()=>showStop(tourI+1));
playBtn.addEventListener("click",()=>{ tourPlaying=!tourPlaying; if(tourPlaying&&tourI===TOUR.length-1) showStop(0); else schedule(); });
$("tourClose").addEventListener("click",closeTour);
$("tourMore").addEventListener("click",()=>{ tourPlaying=false; schedule(); openSlice(TOUR[tourI].y); applyFocus(TOUR[tourI].k); });
addEventListener("keydown",e=>{ if(e.key==="Escape"&&!tourEl.hidden&&!panel.classList.contains("open")) closeTour(); });

render();
/* Open at the turn of the eras, when Rome and Han bracket Eurasia */
sc.scrollLeft=X(1)+PAD-viewW()/2; update();

})();
</script>
